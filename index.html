<!DOCTYPE html>
<html lang="zh-Hant"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#f6f2ea">
<title>神奇學苑 · 香量線上填單</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--bg:#f6f2ea;--bg2:#fbf8f1;--panel:#fff;--line:#e2d8c4;--gold:#9c7e3a;--gold2:#7a6228;--cream:#3a3024;--txt:#2e2820;--mut:#8a7e6a;--green:#3fa86b;--red:#c0392b;--fs:16px}
.dark{--bg:#1f1d1a;--bg2:#272320;--panel:#2c2723;--line:#473f36;--gold:#c9a961;--gold2:#e0c585;--cream:#f4e9c8;--txt:#f0ece2;--mut:#9c9486;--green:#7fae6e;--red:#d9776a}
.big{--fs:19px}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg)}
body{background:var(--bg);color:var(--txt);font-family:'Noto Sans TC',sans-serif;font-size:var(--fs);line-height:1.55;min-height:100vh}
.wrap{max-width:780px;margin:0 auto;padding:16px 14px 100px}
header.top{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid var(--gold);padding-bottom:12px;flex-wrap:wrap;gap:8px}
h1{font-family:'Noto Serif TC',serif;font-weight:900;color:var(--gold2);font-size:1.4em;letter-spacing:1px}
h1 small{display:block;font-size:.44em;color:var(--mut);letter-spacing:3px;font-weight:500;margin-top:4px}
.who{font-family:'Noto Serif TC',serif;font-weight:900;color:#fff;background:var(--gold);border-radius:9px;padding:7px 14px;font-size:1em}
.toggles button{background:var(--panel);color:var(--txt);border:1px solid var(--line);border-radius:7px;padding:8px 12px;cursor:pointer;font-size:1em;margin-left:5px;font-family:inherit}
.toggles button.on{background:var(--gold);color:#fff;border-color:var(--gold)}
.bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:10px;padding:12px 15px;margin:14px 0}
.bar label{color:var(--gold2);font-family:'Noto Serif TC',serif;font-weight:700;margin-right:6px}
.bar input{background:var(--bg);border:1px solid var(--line);color:var(--txt);border-radius:7px;padding:8px 11px;font-family:inherit;font-size:1em}
#status{margin-left:auto;font-size:.82em;color:var(--mut)}#status.ok{color:var(--green)}#status.err{color:var(--red)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 4px}
.tab{flex:1;min-width:84px;background:var(--panel);border:1px solid var(--line);color:var(--txt);border-radius:10px 10px 0 0;padding:11px 6px;cursor:pointer;font-family:'Noto Serif TC',serif;font-weight:700;font-size:1em;text-align:center}
.tab.active{background:var(--gold);color:#fff;border-color:var(--gold)}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:0 14px 14px 14px;margin:0 0 16px;padding:18px}
.card h2{font-family:'Noto Serif TC',serif;font-size:1.05em;color:var(--cream);font-weight:700;display:flex;align-items:center;gap:8px;margin-bottom:3px}
.card h2 .n{background:var(--gold);color:#fff;width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:900;font-size:.7em}
.sub{color:var(--mut);font-size:.8em;margin:2px 0 14px;line-height:1.5}
.field{margin-bottom:13px}
.field>label{display:block;color:var(--gold2);font-weight:700;font-size:.9em;margin-bottom:5px}
.field .req{color:var(--red);margin-left:3px}
.field input,.field select{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:11px 12px;font-family:inherit;font-size:1.02em}
.field input:focus,.field select:focus{outline:none;border-color:var(--gold)}
.field.miss input,.field.miss select{border-color:var(--red);background:rgba(192,57,43,.05)}
.ymd{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.ymd .cal{flex:0 0 78px}.ymd .seg{flex:1;min-width:58px;display:flex;align-items:center;gap:4px}
.ymd .seg input{text-align:center}.ymd .seg span{color:var(--mut);font-size:.85em}
.fhint{color:var(--gold2);font-size:.78em;margin-top:4px;background:rgba(156,126,58,.08);border-radius:6px;padding:5px 9px}
.fhint:empty{display:none}
.grouphd{font-family:'Noto Serif TC',serif;color:var(--gold2);font-weight:700;font-size:.88em;margin:16px 0 9px;padding-left:8px;border-left:3px solid var(--gold)}
.itembox{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:13px}
.fitem{position:relative;background:var(--bg2);border:1px solid var(--line);border-radius:11px;padding:13px 12px 12px;margin-bottom:11px}
.fi-del{position:absolute;top:8px;right:8px;background:transparent;border:1px solid var(--line);color:var(--red);font-size:.8em;cursor:pointer;padding:5px 9px;border-radius:7px;font-family:inherit}
.fi-item{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--txt);border-radius:9px;padding:12px 11px;font-family:inherit;font-size:1.05em;margin-bottom:10px}
.fi-qrow{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.fi-qlabel{color:var(--gold2);font-weight:700;font-size:.92em;margin-right:auto}
.fi-step{width:46px;height:46px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--gold2);font-size:24px;font-weight:700;cursor:pointer;line-height:1;font-family:inherit}
.fi-step:active{background:var(--gold);color:#fff}
.fi-qty{width:66px;height:46px;text-align:center;font-size:1.2em;background:var(--panel);border:1px solid var(--line);color:var(--txt);border-radius:9px;font-family:inherit}
.fi-qty:focus{outline:none;border-color:var(--gold)}
.fi-wish{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--txt);border-radius:9px;padding:10px 11px;font-family:inherit;font-size:.98em}
.fi-wish:focus{outline:none;border-color:var(--gold)}
.fi-partner{margin-top:10px;padding:11px;border:1px dashed var(--gold);border-radius:9px;background:rgba(156,126,58,.05)}
.fi-partner .fp-hd{margin-bottom:8px}
.fi-partner .fp-title{font-weight:700;font-size:1.05em;color:var(--gold2)}
.fi-partner .fp-note{font-size:.82em;color:var(--mut);margin-top:2px}
.fi-partner input,.fi-partner select{background:var(--panel);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:9px;font-family:inherit;font-size:.95em}
.fp-name{width:100%;margin-bottom:8px}
.fp-bd{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.fp-y{width:72px}.fp-m,.fp-d{width:56px}
.fp-prev{font-size:.82em;color:var(--mut);margin-top:6px}
.additem{background:transparent;border:1px dashed var(--gold);color:var(--gold);border-radius:8px;padding:8px;width:100%;cursor:pointer;font-family:'Noto Serif TC';font-weight:700;font-size:.92em}
.actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.btn{background:var(--gold);color:#fff;border:none;border-radius:9px;padding:13px 24px;font-size:1.04em;font-weight:700;cursor:pointer;font-family:'Noto Serif TC',serif;letter-spacing:1px;flex:1;min-width:130px}
.btn:hover{background:var(--gold2)}.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--gold);border:1px solid var(--gold);flex:0 0 auto;min-width:0;padding:13px 16px}
.listcard{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:16px}
.catgroup{margin-bottom:14px}
.catgroup h3{font-family:'Noto Serif TC',serif;color:var(--gold2);font-size:.95em;margin-bottom:6px;display:flex;justify-content:space-between}
.catgroup h3 .c{color:var(--mut);font-weight:400;font-size:.85em}
.entry{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:9px 12px;margin-bottom:6px}
.entry .info{flex:1;min-width:0;font-size:.92em}
.entry .info small{color:var(--mut);display:block;font-size:.82em;margin-top:1px}
.entry.ed{outline:2px solid var(--gold)}
.rowbtn{background:transparent;border:none;cursor:pointer;font-size:.9em;padding:3px 6px;font-family:inherit}
.rowbtn.e{color:var(--gold2)}.rowbtn.d{color:var(--red)}
.empty{color:var(--mut);text-align:center;padding:18px;font-size:.9em}
.totbar{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#fff;border-radius:11px;padding:13px 16px;margin-top:12px;font-size:.92em;line-height:1.7}
.totbar b{font-size:1.15em}
.totbar .items{font-size:.84em;opacity:.92;margin-top:5px;border-top:1px solid rgba(255,255,255,.25);padding-top:5px}
.banner{border-radius:9px;padding:11px 14px;margin:8px 0;font-size:.88em;line-height:1.5}
.banner.info{background:rgba(156,126,58,.12);border-left:3px solid var(--gold);color:var(--gold2)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(80px);background:var(--gold2);color:#fff;padding:12px 22px;border-radius:30px;font-weight:700;box-shadow:0 6px 20px rgba(0,0,0,.25);opacity:0;transition:.3s;z-index:99;font-size:.92em}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}

/* ===== 品階內測版：強制淺色 ===== */
@media (prefers-color-scheme: dark){:root{color-scheme:light only;--bg:#f6f2ea;--bg2:#fbf8f1;--panel:#fff;--txt:#2e2820;--mut:#8a7e6a}html,body{background:var(--bg);color:var(--txt)}}
:root{color-scheme:light only}
/* 內測條 */
.betabar{position:sticky;top:0;z-index:50;background:#2e2820;color:#f6f2ea;font-size:14px;padding:8px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
.betabar b{color:#ffd98a}
.betabar select,.betabar button{font-family:inherit;font-size:14px;border-radius:7px;padding:6px 10px;border:1px solid #6b604f;background:#fff;color:#2e2820;cursor:pointer}
.betabar button.hl{background:#ffd98a;border-color:#ffd98a;font-weight:700}
.betatag{display:inline-block;background:#2e2820;color:#ffd98a;font-size:.72em;border-radius:5px;padding:1px 6px;margin-left:5px;vertical-align:1px}
.localnote{background:#fff7e0;border:1px dashed #c9a24a;color:#6b4e12;border-radius:9px;padding:9px 12px;font-size:.86em;margin:10px 0;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.localnote button{margin-left:auto;background:#fff;border:1px solid #c9a24a;color:#6b4e12;border-radius:7px;padding:5px 10px;cursor:pointer;font-family:inherit;font-size:.95em}
/* 身分章 */
.who{background:var(--gold)!important;display:inline-flex;align-items:center;gap:6px}
.who svg{width:24px;height:24px;flex:0 0 auto}
/* 品階主卡 */
.hero{position:relative;overflow:hidden;border-radius:16px;margin:14px 0 4px;background:linear-gradient(140deg,var(--rk-light) 0%,#fff 60%,var(--rk-light) 100%);border:1.5px solid var(--gold);box-shadow:0 6px 22px rgba(0,0,0,.07)}
.hero::before{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,var(--rk-glow) 0%,transparent 70%);opacity:.55;pointer-events:none}
.hero-top{display:flex;gap:14px;align-items:center;padding:18px 18px 12px;position:relative}
.hero-badge{flex:0 0 auto;width:92px;height:92px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.18))}
.hero-badge svg{width:100%;height:100%}
.hero-info{min-width:0;flex:1}
.hero-rank{display:inline-flex;align-items:center;gap:6px;background:var(--gold);color:#fff;border-radius:20px;padding:3px 12px;font-size:.8em;font-weight:700;letter-spacing:1px}
.hero-name{font-family:'Noto Serif TC',serif;font-weight:900;font-size:1.55em;color:var(--gold2);margin-top:5px;line-height:1.25}
.hero-name small{font-size:.55em;color:var(--mut);font-weight:500;margin-left:4px}
.hero-title{font-family:'Noto Serif TC',serif;font-weight:700;color:var(--gold);font-size:.98em;margin-top:2px}
.hero-slogan{color:var(--txt);font-size:.9em;margin-top:4px;line-height:1.5}
.goals{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 18px 14px;position:relative}
.goal{background:rgba(255,255,255,.85);border:1px solid var(--line);border-radius:12px;padding:11px 13px}
.goal .gl{font-size:.8em;color:var(--mut);font-weight:700;letter-spacing:.5px}
.goal .gv{font-family:'Noto Serif TC',serif;font-weight:900;color:var(--gold2);font-size:1.25em;margin-top:2px}
.goal .gv small{font-size:.6em;color:var(--mut);font-weight:500}
.pbar{height:11px;background:#ece6da;border-radius:8px;overflow:hidden;margin:8px 0 5px}
.pbar i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,var(--gold),var(--gold2));transition:width .6s}
.goal .gn{font-size:.8em;color:var(--txt);line-height:1.5}
.goal .gn b{color:var(--gold2)}
.goal.done{border-color:var(--gold);background:linear-gradient(135deg,#fff,var(--rk-light))}
.stamp{display:inline-block;border:2px solid var(--gold);color:var(--gold);font-weight:900;border-radius:6px;padding:0 6px;font-size:.78em;transform:rotate(-6deg);margin-left:6px}
.ladder{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;padding:12px 12px 14px;border-top:1px dashed var(--line);position:relative;background:rgba(255,255,255,.5)}
.rung{text-align:center;padding:6px 2px;border-radius:10px;position:relative}
.rung svg{width:40px;height:40px;display:block;margin:0 auto 3px}
.rung .rn{font-weight:700;font-size:.8em}
.rung .rp{font-size:.7em;color:var(--mut);line-height:1.3}
.rung.lock svg{filter:grayscale(1);opacity:.35}
.rung.lock .rn{color:#aaa}
.rung.cur{background:#fff;box-shadow:0 0 0 2px var(--gold) inset}
.rung.cur .rn{color:var(--gold2)}
.rung.cur::after{content:"目前";position:absolute;top:-8px;left:50%;transform:translateX(-50%);background:var(--gold);color:#fff;font-size:.62em;border-radius:8px;padding:0 6px;line-height:16px}
.hero-note{font-size:.74em;color:var(--mut);padding:0 18px 12px;line-height:1.5;position:relative}
.hero.locked{background:#faf8f3;border-style:dashed}
.lockmsg{padding:16px 18px;display:flex;gap:12px;align-items:center}
.lockmsg .ic{font-size:34px}
.lockmsg b{font-family:'Noto Serif TC',serif;color:var(--gold2);font-size:1.08em}
@media (max-width:560px){
  .goals{grid-template-columns:1fr}
  .ladder{grid-template-columns:repeat(3,1fr);row-gap:12px}
  .hero-badge{width:74px;height:74px}
  .hero-name{font-size:1.35em}
}
/* 專屬設定面板 */
.rkmask{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9999;overflow:auto;padding:16px}
.rkpanel{background:#fff;border-radius:14px;max-width:760px;margin:10px auto;padding:18px;box-shadow:0 10px 40px rgba(0,0,0,.3);color:#2e2820}
.rkpanel h3{font-family:'Noto Serif TC',serif;color:#7a6228;font-size:1.2em;margin-bottom:4px}
.rkpanel .hint{font-size:13px;color:#8a7a4a;line-height:1.6;margin-bottom:12px}
.rkrow{border:1px solid #e6ddc6;border-radius:12px;padding:12px;margin-bottom:10px;display:grid;grid-template-columns:52px 1fr;gap:10px;align-items:start}
.rkrow svg{width:52px;height:52px}
.rkrow .nm{font-weight:800;font-size:15px;margin-bottom:6px}
.rkf{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rkf label{font-size:12px;color:#7a6a4a;display:block}
.rkf input,.rkf select{width:100%;padding:8px;border:1px solid #d8cca8;border-radius:7px;font-family:inherit;font-size:14px;background:#fff;color:#2e2820}
.rkf input[type=color]{padding:2px;height:36px}
.rkf .wide{grid-column:span 3}
.rkf .w2{grid-column:span 2}
@media (max-width:560px){.rkf{grid-template-columns:1fr 1fr}.rkf .wide,.rkf .w2{grid-column:span 2}}
.rkbtns{display:flex;gap:8px;flex-wrap:wrap;position:sticky;bottom:-18px;background:#fff;padding:12px 0 4px;border-top:1px solid #eee}
.rkbtns button{border:none;border-radius:9px;padding:11px 16px;font-size:15px;cursor:pointer;font-family:inherit}

/* ===== 精簡品階條 ===== */
.h2{border:1.5px solid var(--gold);border-radius:14px;padding:10px 12px;margin:12px 0 2px;background:linear-gradient(135deg,var(--rk-light),#fff);box-shadow:0 3px 12px rgba(0,0,0,.05)}
.h2lock{border-style:dashed;background:#faf8f3;color:var(--mut);font-size:.88em;text-align:center}
.h2row{display:flex;align-items:center;gap:10px}
.h2badge{flex:0 0 auto;width:48px;height:48px;border:none;background:none;padding:0;cursor:pointer;filter:drop-shadow(0 2px 4px rgba(0,0,0,.18))}
.h2badge svg{width:100%;height:100%}
.h2id{min-width:0;flex:1}
.h2name{font-family:'Noto Serif TC',serif;font-weight:900;color:var(--gold2);font-size:1.12em;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.h2deco{display:inline-flex;width:20px;height:20px}.h2deco svg{width:100%;height:100%}
.h2chip{background:var(--gold);color:#fff;border-radius:12px;padding:1px 9px;font-size:.62em;font-family:'Noto Sans TC',sans-serif;font-weight:700;letter-spacing:.5px}
.h2title{font-size:.8em;color:var(--gold);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.h2title span{color:var(--mut);font-weight:400}
.h2bars{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.h2bar{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:6px;font-size:.76em;color:var(--txt)}
.h2bar span{font-weight:700;color:var(--gold2);white-space:nowrap}
.h2bar small{color:var(--mut);white-space:nowrap;font-size:1em}
.h2bar .pbar{height:7px;margin:0}
.h2bar.done span,.h2bar.done small{color:var(--gold)}
.h2 .ladder{display:none;border-top:1px dashed var(--line);margin-top:8px;padding:8px 0 0;background:none}
.h2 .ladder.open{display:grid}
.h2 .rung svg{width:30px;height:30px}
@media (max-width:480px){.h2bars{grid-template-columns:1fr;gap:5px}}

/* 獎金試算 */
.h2money{margin-top:7px;font-size:.8em;color:var(--txt);display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.h2money b{color:var(--gold2);font-size:1.12em}
.h2money small{color:var(--mut)}
.h2tip{margin-left:auto;color:var(--mut)}.h2tip b{color:var(--gold2);font-size:1em}
.h2plus{background:#3fa86b;color:#fff;border-radius:10px;padding:0 7px;font-size:.9em;font-weight:700;animation:pop 1.6s ease-out forwards}
@keyframes pop{0%{transform:scale(.6) translateY(4px);opacity:0}20%{transform:scale(1.15);opacity:1}80%{opacity:1}100%{opacity:.0}}
/* 客戶提醒 */
.crbar{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:8px 12px;margin:8px 0 0;cursor:pointer;font-size:.86em;flex-wrap:wrap}
.crbar>span:first-child{font-weight:700;color:var(--gold2)}
.crn{color:var(--txt)}.crwait{color:var(--mut)}
.crarr{margin-left:auto;color:var(--mut)}
.crpanel{background:var(--panel);border:1px solid var(--line);border-top:none;border-radius:0 0 11px 11px;margin-top:-4px;padding:10px 12px 8px}
.crtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.crtabs button{flex:1;min-width:92px;border:1px solid var(--line);background:var(--bg2);color:var(--txt);border-radius:8px;padding:7px 4px;font-family:inherit;font-size:.82em;cursor:pointer}
.crtabs button.on{background:var(--gold);border-color:var(--gold);color:#fff}
.crrow{display:flex;align-items:center;gap:8px;border-bottom:1px dashed var(--line);padding:7px 2px}
.crrow .info{flex:1;min-width:0;font-size:.9em;font-weight:700}
.crrow .info small{display:block;font-weight:400;color:var(--mut);font-size:.82em}
.crrow button{flex:0 0 auto;border:1px solid var(--gold);background:#fff;color:var(--gold2);border-radius:7px;padding:5px 9px;font-family:inherit;font-size:.78em;cursor:pointer}
.crmore{width:100%;margin-top:6px;border:1px dashed var(--gold);background:none;color:var(--gold2);border-radius:7px;padding:6px;font-family:inherit;cursor:pointer;font-size:.82em}
.crfoot{font-size:.72em;color:var(--mut);margin-top:6px;text-align:right}.crfoot a{color:var(--gold2)}

.lt{position:relative}.lt .ltnum{position:absolute;top:4px;left:6px;font-size:.72em;font-weight:700;color:var(--c);opacity:.85}

/* 固定大字；法會項目卡片的移除鈕 */
#fahuiItems{counter-reset:fi}

/* ================= 精緻化（2026-09-26） ================= */
body{background:linear-gradient(180deg,var(--bg) 0%,#fff 520px,var(--bg) 100%) fixed;letter-spacing:.2px}
.wrap{padding:10px 14px 90px}
/* 頂部：一條精簡列 */
header.top{border-bottom:none;padding:6px 0 4px;align-items:center;flex-wrap:nowrap}
header.top h1{font-size:1.05em;letter-spacing:3px;color:var(--gold2);white-space:nowrap}
header.top h1 small{display:none}
header.top>div{flex-wrap:nowrap!important;gap:6px!important}
.who{font-size:.72em!important;padding:5px 10px!important;border-radius:20px!important;white-space:nowrap}
.who.hide{display:none!important}
#logoutBtn{border-radius:20px!important;padding:5px 12px!important;font-size:.72em!important;background:#fff!important}

.portalbtn{border-radius:20px;padding:5px 11px;font-size:.72em;white-space:nowrap;border-color:var(--line);box-shadow:0 1px 3px rgba(0,0,0,.05)}
/* 月份列 */
.bar{background:transparent;border:none;border-left:none;padding:4px 2px;margin:12px 0 2px;gap:8px}

.bar select#month{border-radius:20px!important;padding:5px 12px!important;font-size:.85em!important;background:#fff!important;border-color:var(--line)!important}

#status.err{color:#b3453a;border-color:#efcfca}
/* 分類：分段按鈕 */
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:4px;margin:10px 0 12px;box-shadow:0 2px 10px rgba(0,0,0,.04)}
.tab{min-width:0;border:none;border-radius:12px;padding:10px 2px;font-size:.88em;background:transparent;color:var(--mut)}
.tab.active{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#fff;box-shadow:0 3px 10px color-mix(in srgb,var(--gold) 35%,transparent)}
/* 卡片 */
.card{background:#fff;border:1px solid color-mix(in srgb,var(--line) 70%,#fff);border-radius:20px;padding:20px 16px;box-shadow:0 6px 24px rgba(40,30,10,.06)}
.card h2{font-size:1.05em;color:var(--gold2)}
.card h2 .n{background:linear-gradient(135deg,var(--gold),var(--gold2));width:24px;height:24px}
.sub{font-size:.76em}
.field>label{font-size:.82em;letter-spacing:.5px;margin-bottom:6px}
.field input,.field select,.fi-item,.fi-wish,.fi-qty,.fi-step{border-radius:12px!important;border:1px solid #e5ddcc!important;background:#fcfbf8!important;transition:border-color .15s,box-shadow .15s}
.field input:focus,.field select:focus,.fi-item:focus,.fi-wish:focus,.fi-qty:focus{outline:none;border-color:var(--gold)!important;box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 18%,transparent);background:#fff!important}

.itembox{background:transparent;border:none;padding:0}
.fitem{background:#fff;border:1px solid #ece4d3;border-radius:16px;box-shadow:0 2px 8px rgba(0,0,0,.03)}
.fi-step{background:#fff!important;color:var(--gold2)!important}
.additem{border-radius:14px;padding:11px;background:#fff;font-size:.88em}
.btn{border-radius:14px;background:linear-gradient(135deg,var(--gold),var(--gold2));box-shadow:0 6px 16px color-mix(in srgb,var(--gold) 30%,transparent);font-size:1em;padding:14px 20px}
.btn:hover{filter:brightness(1.05);background:linear-gradient(135deg,var(--gold),var(--gold2))}

/* 已填清單 */
.listcard{background:#fff;border:1px solid color-mix(in srgb,var(--line) 70%,#fff);border-radius:20px;box-shadow:0 6px 24px rgba(40,30,10,.06);padding:18px 16px}

.entry .info{font-weight:700}
.totbar{border-radius:16px;background:linear-gradient(135deg,var(--gold2),var(--gold));box-shadow:0 8px 20px color-mix(in srgb,var(--gold) 30%,transparent)}
.localnote{border-radius:12px;font-size:.78em}
/* 品階條、客戶提醒一致化 */
.h2,.crbar{border-radius:18px}

#rankRules{margin-top:16px}
.rrhd{display:flex;justify-content:space-between;align-items:center;background:#fff;border:1px solid color-mix(in srgb,var(--line) 70%,#fff);border-radius:18px;padding:13px 16px;cursor:pointer;box-shadow:0 4px 16px rgba(40,30,10,.05);font-weight:700;color:var(--gold2);font-size:.92em}

.rrhow{font-size:.8em;margin-top:2px}.rrhow b{color:var(--gold2)}
.rrpks{margin-top:4px;display:flex;flex-direction:column;gap:2px}
.rrpk{font-size:.72em;color:var(--txt)}.rrpk em{font-style:normal;color:var(--mut);margin-right:6px}

.ladder,.h2 .ladder.open,.h2more .ladder{grid-template-columns:repeat(5,1fr)!important}
@media (max-width:560px){.ladder,.h2 .ladder.open,.h2more .ladder{grid-template-columns:repeat(5,1fr)!important}.h2more .rung .rn{font-size:.66em}.h2more .rung .rp{font-size:.6em}.h2 .rung svg{width:26px;height:26px}}

.celebrate{position:fixed;inset:0;z-index:10000;background:rgba(20,15,5,.55);display:flex;align-items:center;justify-content:center;animation:cfade .3s}

const SBX_PREFIX='rankBeta_data_';
function sbxKey(t,m){return SBX_PREFIX+t+'|'+m;}
function sbxLoad(t,m){try{const v=lsGet(sbxKey(t,m));return v?JSON.parse(v):null}catch(e){return null}}
function sbxSave(t,m,d){lsSet(sbxKey(t,m),JSON.stringify(d));}
let SBX_LOCAL=false;
function nnum(v){const n=parseFloat((''+(v==null?'':v)).replace(/[,\s]/g,''));return isNaN(n)?0:n;}
function sbxAgg(data){
  const a={}; ITEMS.forEach(i=>a[i]=0); ['天赦金','還陰債','年斗','季斗','五行年斗','五行季斗','令牌','祭改','普桌','化煞水'].forEach(k=>a[k]=0);
  const dt=t=>{t=(''+t).trim();if(t==='令牌加購')return'令牌';if(t==='五行年斗')return'五行年斗';if(t==='五行季斗')return'五行季斗';if(t==='季斗加購')return'季斗';return'年斗';};
  (data['法會']||[]).forEach(r=>{const it=(''+r['項目']).trim(),q=nnum(r['份數']);if(it==='天赦金')a['天赦金']+=q;else if(ITEMS.indexOf(it)>=0)a[it]+=q;});
  (data['斗燈']||[]).forEach(r=>{a[dt(r['加購類型'])]+=nnum(r['份數']);});
  ['還陰債','祭改','普桌'].forEach(c=>(data[c]||[]).forEach(r=>{a[c]+=nnum(r['份數']);}));
  a['萬寶小計']=ITEMS.reduce((s,i)=>s+nnum(a[i]),0);

}
function sbxHandle(b){
  const act=b.action; const W=['add','addBatch','update','delete'];
  if(W.indexOf(act)<0) return {ok:false,error:'內測版不會改動正式設定（這個動作要在正式版做）'};
  const t=b.teacher||TEACHER, m=b.month||MONTH;
  const data=sbxLoad(t,m)||JSON.parse(JSON.stringify(DATA||{}));
  const cat=b.category; data[cat]=data[cat]||[];
  const strip=o=>{const r=Object.assign({},o);['action','category','month','teacher','rows'].forEach(k=>delete r[k]);return r;};
  const newId=()=>'內測'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
  if(act==='add'){ const r=strip(b); r.編號=newId(); r._beta=1; data[cat].push(r); }
  if(act==='addBatch'){ (b.rows||[]).forEach(x=>{const r=Object.assign({},x);r.編號=newId();r._beta=1;data[cat].push(r);}); }
  if(act==='update'){ const id=String(b['編號']); const i=data[cat].findIndex(x=>String(x.編號)===id); if(i>=0){ data[cat][i]=Object.assign({},data[cat][i],strip(b),{編號:data[cat][i].編號,_beta:1,異動:'已修改'}); } }
  if(act==='delete'){ const id=String(b['編號']); data[cat]=data[cat].filter(x=>String(x.編號)!==id); }
  sbxSave(t,m,data); SBX_LOCAL=true;
  return {ok:true,data:data,totals:sbxAgg(data)};
}
const _realFetch=window.fetch.bind(window);
const fakeRes=o=>Promise.resolve({json:()=>Promise.resolve(o)});
window.fetch=function(url,opt){
  const isApi=BETA&&typeof url==='string'&&typeof API_URL!=='undefined'&&API_URL&&url.indexOf(API_URL)===0;
  if(isApi&&!(opt&&String(opt.method||'').toUpperCase()==='POST')&&url.indexOf('?')>0) url=secAttachUrl(url);
  if(isApi&&/action=(teachers|sysConfig)(&|$)/.test(url)){
    return _realFetch(url,opt).then(r=>r.json()).then(d=>{ d=cleanDeep(d);
      if(d&&Array.isArray(d.teachers)){ SERVER_NAMES=d.teachers.map(t=>t.name); d.teachers=fixTeacherList(d.teachers); }
      return {json:()=>Promise.resolve(d)}; });
  }
  if(isApi&&url.indexOf('action=list')>=0){   // 後台還沒有的老師（實習老師）：不去碰正式後台，免得替他自動開新表
    const q0=new URLSearchParams(url.split('?')[1]||''); const tn=q0.get('teacher');
    if(isIntern(tn)&&(!SERVER_NAMES||SERVER_NAMES.indexOf(tn)<0)){
      { const loc=sbxLoad(tn,q0.get('month')); const data=loc||{}; SBX_LOCAL=!!loc; return fakeRes({ok:true,data:data,totals:sbxAgg(data)}); }
    }
  }
  if(isApi&&opt&&String(opt.method||'').toUpperCase()==='POST'){
    let b={};try{b=JSON.parse(opt.body)}catch(e){}
    return fakeRes(sbxHandle(b));
  }
  if(isApi&&url.indexOf('action=list')>=0){
    const q=new URLSearchParams(url.split('?')[1]||''); const t=q.get('teacher'),m=q.get('month');
    const loc=sbxLoad(t,m);
    return _realFetch(url,opt).then(r=>r.json()).then(d=>{
      if(d&&d.needLogin){ secSet('sec_tok',''); try{localStorage.removeItem('xlUser')}catch(e){} alert('登入已過期，請重新登入'); location.reload(); return {json:()=>Promise.resolve({ok:false})}; }
      if(loc){d={ok:true,data:loc,totals:sbxAgg(loc)};SBX_LOCAL=true;} else SBX_LOCAL=false;
      return {json:()=>Promise.resolve(d)};
    }).catch(err=>{ if(loc){SBX_LOCAL=true;return {json:()=>Promise.resolve({ok:true,data:loc,totals:sbxAgg(loc)})};} throw err; });
  }
  return _realFetch(url,opt);
};

function tierAwardPct(pv){return pv>=400000?10:pv>=300000?8:pv>=200000?5:pv>=100000?2:0;}
function nextTier(pv){const T=[[100000,2],[200000,5],[300000,8],[400000,10]];for(const t of T){if(pv<t[0])return t;}return null;}
const LAST_BONUS={};
function bonusLineHTML(name,est){
  if(CORE4.indexOf(name)>=0) return `<div class="h2money">💰 本月香量業績約 <b>${fmt$(est)}</b><small>　核心 1% 獎金池月結另算</small></div>`;
  const pct=tierAwardPct(est), bonus=Math.round(est*pct/100), nt=nextTier(est);
  const key=name+'|'+MONTH; const prev=LAST_BONUS[key]; LAST_BONUS[key]=bonus;
  const up=(prev!=null&&bonus>prev)?`<span class="h2plus">+${fmt$(bonus-prev)}</span>`:'';
  const tip=nt?`再 <b>${fmtW(nt[0]-est)}</b> 獎金升到 <b>${nt[1]}%</b>`:'已是最高 10%';
  return `<div class="h2money">💰 業績獎金約 <b>${fmt$(bonus)}</b>${up}<small>（${pct}%）</small><span class="h2tip">${tip}</span></div>`;
}

/* 連不到後台時才用的示範資料（畫面會標示） */
function demoHistory(ms){
  const nm=['王美玲','林志明','陳怡君','張家豪','黃淑芬','李建宏','吳佩珊','劉俊傑','蔡雅婷','楊文彬','許惠如','鄭宇翔'];

  const out={}; const today=new Date();
  ms.forEach((m,mi)=>{out[m]={'法會':[]};});
  nm.forEach((n,i)=>{
    const lun=solar2lunar(today.getFullYear(),today.getMonth()+1,Math.min(28,today.getDate()+(i%4)*2));
    const bm=i<3?lun.lMonth:((i*5)%12)+1, bd=i<3?lun.lDay:((i*7)%28)+1;

function custIndex(name){

  const months=Object.assign({},H.months);
  if(!H.demo&&TEACHER===name&&MONTH) months[MONTH]=DATA||{};   // 本月用畫面上最新的
  const C={};
  const add=(n,r,m,cat,item)=>{
    n=(''+(n||'')).trim(); if(!n||n.charAt(0)==='#') return;
    const bmRaw=''+(r['生日月']||''), bm=bmRaw.replace('閏',''), bd=''+(r['生日日']||'');
    const k=n+'|'+(r['生日年']||'')+'/'+bm+'/'+bd;
    const c=C[k]=C[k]||{name:n,by:r['生日年']||'',bmRaw:bmRaw,bm:+bm||0,bd:+bd||0,visits:[]};
    c.visits.push({m,cat,item,qty:+r['份數']||1});
  };
  Object.keys(months).forEach(m=>{const D=months[m]||{};

    (D['斗燈']||[]).forEach(r=>add(r['姓名'],r,m,'斗燈',(r['斗種']||'')+(r['加購類型']?'（'+r['加購類型']+'）':'')));
    (D['祭改']||[]).forEach(r=>add(r['姓名'],r,m,'祭改','祭改'));
    (D['還陰債']||[]).forEach(r=>add(r['陽世報恩人'],{},m,'還陰債',r['牒文類別']));
  });
  return Object.values(C);
}
function mDiff(a,b){const [ay,am]=a.split('.').map(Number),[by,bm]=b.split('.').map(Number);return (ay-by)*12+(am-bm);}
const WK='日一二三四五六';
function crLists(name){
  const cs=custIndex(name)||[]; const cur=monthsBack(1)[0], prev=monthsBack(2)[1];
  // 生日：今天起 7 天
  const today=new Date(); const days=[];
  const t0=new Date(today.getFullYear(),today.getMonth(),today.getDate());
  const dim=new Date(today.getFullYear(),today.getMonth()+1,0).getDate();
  for(let dd=1;dd<=dim;dd++){const d=new Date(today.getFullYear(),today.getMonth(),dd);const l=solar2lunar(d.getFullYear(),d.getMonth()+1,dd);days.push({d,l,i:Math.round((d-t0)/86400000)});}
  // 生日：以「客人的國曆出生日」算，落在這個國曆月的就是本月壽星
  const curY=today.getFullYear(), curMo=today.getMonth()+1;
  function bdayHit(by,bmRaw,bd){
    const sol=l2sWest(by,bmRaw,bd);
    if(sol){
      if(sol.m!==curMo) return null;
      const d=new Date(curY,sol.m-1,sol.d);
      return {d:d,i:Math.round((d-t0)/86400000),sol:sol};
    }
    const mn=parseInt((''+(bmRaw==null?'':bmRaw)).replace('閏','')), dd=parseInt(bd);
    if(!mn||!dd) return null;
    const h=days.find(x=>x.l.lMonth===mn&&x.l.lDay===dd);
    return h? {d:h.d,i:h.i,sol:null,lun:mn+'/'+dd} : null;
  }
  const bday=[]; const seenB={};
  cs.forEach(c=>{
    const hit=bdayHit(c.by,c.bmRaw!==undefined?c.bmRaw:c.bm,c.bd); if(!hit)return;
    const last=c.visits.slice().sort((a,b)=>mDiff(b.m,a.m))[0];
    seenB[c.name]=1; bday.push({c,hit,last});
  });
  // 再把通訊錄裡（更早以前報過）的客人也補進來
  (CONTACTS||[]).forEach(c=>{
    const nm=(''+c['姓名']).trim(); if(!nm||seenB[nm])return;
    const hit=bdayHit(c['生日年'],c['生日月'],c['生日日']); if(!hit)return;
    seenB[nm]=1;
    bday.push({c:{name:nm,by:c['生日年'],bmRaw:''+(c['生日月']||''),bm:+(''+(c['生日月']||'')).replace('閏','')||0,bd:+c['生日日']||0},
      hit:hit, last:c['最近月份']?{m:''+c['最近月份'],item:'報過 '+(c['次數']||0)+' 個月'}:null});
  });
  bday.sort((a,b)=>{const pa=a.hit.i<0,pb=b.hit.i<0; if(pa!==pb) return pa?1:-1; return pa? b.hit.i-a.hit.i : a.hit.i-b.hit.i;});   // 還沒到的排前面，已過的放後面
  // 該續做：上個月做過（法會／斗燈／還陰債／祭改都算），這個月還沒有
  const renew=[];
  cs.forEach(c=>{const pv=c.visits.filter(v=>v.m===prev);const cv=c.visits.filter(v=>v.m===cur);
    if(pv.length&&!cv.length)renew.push({c,items:[...new Set(pv.map(v=>(v.cat==='法會'?'':v.cat+'·')+(v.item||v.cat)))]});});
  // 很久沒來：最後一次在 IDLE_MONTHS 個月以前（用通訊錄的全部歷史，不只最近 6 個月）
  const idle=[]; const seenIdle={};
  (CONTACTS||[]).forEach(c=>{
    const lm=(''+(c['最近月份']||'')).trim(); if(!/^\d{4}\.\d{1,2}$/.test(lm))return;
    const gap=mDiff(cur,lm.length===6?lm.replace('.','.0'):lm);
    if(gap<IDLE_MONTHS)return;
    const key=(''+c['姓名']).trim(); if(!key||seenIdle[key])return; seenIdle[key]=1;
    idle.push({c:{name:c['姓名'],bm:+(''+(c['生日月']||'')).replace('閏','')||0,bd:+c['生日日']||0},last:{m:lm,item:'報過 '+(c['次數']||0)+' 個月'},gap});
  });
  idle.sort((a,b)=>a.gap-b.gap);
  return {bday,renew,idle};
}
function crMsg(type,o){

    return `${n}您好～${ds}是您的生日，先祝您生日快樂、身體健康、平安順心！新的一歲一切都順順利利 🙏`; }

/* 1) 顯示用跳脫：客戶資料一律當文字顯示，不讓人塞程式碼進來 */
function hx(s){return (''+(s==null?'':s)).replace(/[&<>"'`]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;','`':'&#96;'}[c]));}
/* 名字類（老師、收單人、行政）不可能有這些符號，進來就先清掉 */
function cleanName(s){return (''+(s==null?'':s)).replace(/[<>"'`&\\]/g,'').slice(0,40);}
function cleanDeep(o){ if(typeof o==='string') return cleanName(o); if(Array.isArray(o)) return o.map(cleanDeep); if(o&&typeof o==='object'){const r={};Object.keys(o).forEach(k=>r[k]=cleanDeep(o[k]));return r;} return o; }

/* 2) 登入憑證：後台升級成「強制模式」後，每次讀寫都要帶憑證；舊後台會忽略，不影響現在使用 */
function secGet(k){try{return sessionStorage.getItem(k)||''}catch(e){return ''}}
function secSet(k,v){try{v?sessionStorage.setItem(k,v):sessionStorage.removeItem(k)}catch(e){}}
function secLogin(name,pw){
  if(!API_URL) return Promise.resolve();
  return _realFetch(API_URL+'?action=login&name='+encodeURIComponent(name)+'&pw='+encodeURIComponent(pw))
    .then(r=>r.json()).then(d=>{ if(d&&d.ok&&d.token) secSet('sec_tok',d.token); }).catch(()=>{});
}
function secAttachUrl(url){
  const tok=secGet('sec_tok'), key=secGet('sec_key');
  if(tok) url+='&token='+encodeURIComponent(tok);
  if(key) url+='&key='+encodeURIComponent(key);
  return url;
}

function mergeData(d){
  if(!d) return;
  if(d.partial && d.cat){ DATA[d.cat]=(d.data&&d.data[d.cat])||[]; }
  else if(d.data){ DATA=d.data; }
  if(d.totals){
    if(d.partial){ Object.keys(d.totals).forEach(k=>{ if(d.totals[k]) TOTALS[k]=d.totals[k]; }); }
    else TOTALS=d.totals;
  }
}

function focusForm(){

/* ---------- 自動完成 ---------- */
const AC_KEYS=['姓名','陽世報恩人'];
let acEl=null, acIdx=-1, acList=[];

function acAttachReal(){
  AC_KEYS.forEach(function(k){
    const el=document.getElementById('in_'+k);
    if(!el||el.dataset.acBound)return;
    el.dataset.acBound='1';
    el.setAttribute('autocomplete','off');
    const fld=el.parentNode; if(fld&&fld.classList)fld.classList.add('acwrap');
    el.addEventListener('input',function(){acShow(el);});
    el.addEventListener('focus',function(){acShow(el);});
    el.addEventListener('keydown',acKey);
    el.addEventListener('blur',function(){setTimeout(acHide,200);});
  });
}
function acHide(){ const b=document.getElementById('acBox'); if(b)b.remove(); acEl=null; acIdx=-1; acList=[]; }
function acMatch(q){
  q=(q||'').trim();
  if(!q) return [];
  const hit=CONTACTS.filter(function(c){
    const nm=''+(c['姓名']||'');
    return nm.indexOf(q)>=0 || (''+(c['公司行號']||'')).indexOf(q)>=0;
  });
  hit.sort(function(a,b){
    const va=a['常客']?1:0, vb=b['常客']?1:0;
    if(va!==vb)return vb-va;
    return (b['次數']||0)-(a['次數']||0);
  });
  return hit.slice(0,12);
}
function acShow(el){
  acEl=el; acIdx=-1;
  const old=document.getElementById('acBox'); if(old)old.remove();
  if(!CONTACTS_READY){ loadContacts(function(){ if(document.activeElement===el)acShow(el); }); return; }
  acList=acMatch(el.value);
  if(!acList.length) return;
  const wrap=el.parentNode; if(!wrap)return;
  const box=document.createElement('div');
  box.className='acbox'; box.id='acBox';
  let h='<div class="achd">以前報過的客人（點一下自動帶入資料；★＝常客）</div>';
  const here={}; (DATA[CURCAT]||[]).forEach(function(e){ here[(''+(e['姓名']||e['陽世報恩人']||'')).trim()]=true; });
  acList.forEach(function(c,i){
    const b=birthLine(c['生日年'],c['生日月'],c['生日日']);
    const meta=[ here[(''+c['姓名']).trim()]?'⚠ 本月這一類已經填過':'',
                 b?(b+(c['時辰']?' '+c['時辰']+'時':'')):'',
                 c['居住地址']||'', c['公司行號']||'',
                 '報過'+(c['次數']||0)+'個月'+(c['最近月份']?'·最近'+c['最近月份']:'') ].filter(Boolean).join('　|　');
    h+='<div class="acitem" data-i="'+i+'" onmousedown="acPick(event,'+i+')">'
      +'<span class="st'+(c['常客']?' on':'')+'" onmousedown="acStar(event,'+i+')" title="設為／取消常客">'+(c['常客']?'★':'☆')+'</span>'
      +'<span class="nm">'+acEsc(c['姓名'])+'</span><span class="mt">'+acEsc(meta)+'</span></div>';
  });
  box.innerHTML=h;
  wrap.appendChild(box);
}
function acEsc(s){ return (''+(s==null?'':s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
/* 生日別顯示：舊資料有人寫「農」有人寫「農曆」，統一印成「農曆／國曆」 */
function calLabel(v){ v=(''+(v==null?'':v)).trim(); if(v.indexOf('國')>=0) return '國曆'; return '農曆'; }
function acKey(e){
  const box=document.getElementById('acBox'); if(!box)return;
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){
    e.preventDefault();
    acIdx += (e.key==='ArrowDown'?1:-1);
    if(acIdx<0)acIdx=acList.length-1; if(acIdx>=acList.length)acIdx=0;
    box.querySelectorAll('.acitem').forEach(function(n,i){ n.classList.toggle('on',i===acIdx); });
    const on=box.querySelector('.acitem.on'); if(on)on.scrollIntoView({block:'nearest'});
  }else if(e.key==='Enter'){
    if(acIdx>=0){ e.preventDefault(); acFill(acList[acIdx]); acHide(); }
  }else if(e.key==='Escape'){ acHide(); }
}
function acPick(e,i){ e.preventDefault(); acFill(acList[i]); acHide(); }
function acStar(e,i){
  e.preventDefault(); e.stopPropagation();
  const c=acList[i]; if(!c)return;
  const nv=!c['常客']; c['常客']=nv;
  const el=e.target; el.textContent=nv?'★':'☆'; el.classList.toggle('on',nv);
  vipSave(c['姓名'],c['生日年'],nv);
}
function vipSave(name,birthY,vip){
  if(!API_URL)return;
  fetch(API_URL,{method:'POST',body:JSON.stringify({action:'contactVip',teacher:TEACHER,name:name,birthY:birthY,vip:vip})})
    .then(r=>r.json()).then(d=>{ if(d&&d.ok&&d.contacts)CONTACTS=d.contacts; toast(vip?'已設為常客 ⭐':'已取消常客'); })
    .catch(()=>toast('常客設定沒存到，請重試'));
}
/* 把通訊錄資料填進目前這張表單 */
function acFill(c){
  if(!c)return;
  const put=function(id,v){ const e=document.getElementById('in_'+id); if(e&&v!=null&&v!=='')e.value=v; };
  put('姓名',c['姓名']); put('陽世報恩人',c['姓名']);
  put('居住地址',c['居住地址']); put('報恩人居住地址',c['居住地址']);
  put('公司行號',c['公司行號']);
  /* 通訊錄裡存的生日一律是「農曆」（填單時若選國曆，送出前已經換算過一次）
     所以帶入時固定切成農曆，否則送出時會被再換算一次，生日就錯了 */
  const cal=document.getElementById('in_生日別');
  if(cal){ for(let i=0;i<cal.options.length;i++) if(cal.options[i].value==='農') cal.value='農'; }
  put('生日年',c['生日年']);
  const _bm=''+(c['生日月']==null?'':c['生日月']);
  const _lp=document.getElementById('leap_生日年'), _lw=document.getElementById('leapwrap_生日年');
  if(_bm.indexOf('閏')>=0){ put('生日月',_bm.replace('閏','')); if(_lp)_lp.checked=true; }
  else { put('生日月',_bm); if(_lp)_lp.checked=false; }
  if(_lw) _lw.style.display='flex';
  put('生日日',c['生日日']);
  const sc=document.getElementById('in_時辰');
  if(sc&&c['時辰']){ for(let i=0;i<sc.options.length;i++) if(sc.options[i].value===c['時辰'])sc.value=c['時辰']; }
  const sd=document.getElementById('in_收單人');
  if(sd&&c['收單人']){ for(let i=0;i<sd.options.length;i++) if(sd.options[i].value===c['收單人'])sd.value=c['收單人']; }
  try{ const _pv=document.getElementById('prev_生日年'); if(_pv)_pv.textContent=''; }catch(e){}
  try{ if(typeof yinAuto==='function'&&document.getElementById('in_陽世報恩人')) yinAuto(); }catch(e){}
  toast('已帶入「'+c['姓名']+'」的資料（生日為農曆），請確認後送出');
}

/* ---------- ⭐常客名單 ---------- */

function closeVipPanel(){ const m=document.getElementById('vipMask'); if(m)m.remove(); }
function vipRender(){
  const box=document.getElementById('vipList'); if(!box)return;
  const q=(document.getElementById('vipQ')||{}).value||'';

  arr=arr.slice(0,300);
  if(!arr.length){ box.innerHTML='<div class="prow"><span class="mt">沒有符合的客人。若是第一次用，先按下面「重新掃描歷史客人」。</span></div>'; return; }

    const b=birthLine(c['生日年'],c['生日月'],c['生日日']);
    return '<div class="prow"><span class="st'+(c['常客']?' on':'')+'" style="cursor:pointer;font-size:1.1em;color:'+(c['常客']?'#e8b93b':'#8a7a4a')+'" onclick="vipToggle(\''+encodeURIComponent(c['姓名'])+'\',\''+(c['生日年']||'')+'\')">'+(c['常客']?'★':'☆')+'</span>'
      +'<b style="min-width:70px">'+acEsc(c['姓名'])+'</b>'
      +'<span class="mt">'+acEsc([b,c['居住地址']].filter(Boolean).join('　|　'))+'　報過'+(c['次數']||0)+'個月</span></div>';

function vipToggle(nameEnc,by){
  const name=decodeURIComponent(nameEnc);
  let nv=null;
  CONTACTS.forEach(function(c){ if((''+c['姓名'])===name&&(!by||(''+c['生日年'])===by)){ if(nv===null)nv=!c['常客']; c['常客']=nv; } });

function vipRebuild(){

    .then(r=>r.json()).then(d=>{ if(d&&d.ok){ CONTACTS=d.contacts||[]; CONTACTS_READY=true; vipRender(); toast('掃描完成，共 '+CONTACTS.length+' 位客人'); } else toast('掃描失敗'); })
    .catch(()=>toast('連線失敗'));
}

/* ---------- 🔁 帶入上月 ---------- */
let COPY={rows:[],month:'',cat:''};
function prevMonthOf(m){
  const p=(''+m).split('.'); let y=parseInt(p[0],10), mo=parseInt(p[1],10);
  if(!y||!mo)return m; mo--; if(mo<1){mo=12;y--;}
  return y+'.'+String(mo).padStart(2,'0');
}
function openCopyPanel(){
  const src=prevMonthOf(MONTH);
  COPY={rows:[],month:src,cat:CURCAT};
  const m=document.createElement('div'); m.className='mask'; m.id='cpMask';
  m.onclick=function(ev){ if(ev.target===m)closeCopyPanel(); };
  m.innerHTML='<div class="panel"><h3>🔁 帶入上月的「'+CURCAT+'」</h3>'
    +'<div class="ps">把上個月同一批客人整批複製到本月，帶進來之後要改祈願的再個別按「編輯」就好。<br>'

    +'<button class="btn ghost" style="padding:6px 10px;font-size:.85em" onclick="copyCheck(0)">全不選</button>'
    +'<button class="btn ghost" style="padding:6px 10px;font-size:.85em" onclick="copyCheck(2)">只選⭐常客</button>'
    +'</div>'
    +'<div class="plist" id="cpList"><div class="prow"><span class="mt">讀取中…</span></div></div>'
    +'<div class="actions" style="margin-top:14px">'
    +'<button class="btn" id="cpGo" onclick="copyGo()">帶入本月</button>'
    +'<button class="btn ghost" onclick="closeCopyPanel()">取消</button></div></div>';
  document.body.appendChild(m);
  const sel=document.getElementById('cpMonth');
  const opts=[]; let mm=MONTH;
  for(let i=0;i<12;i++){ mm=prevMonthOf(mm); opts.push(mm); }
  sel.innerHTML=opts.map(o=>'<option value="'+o+'">'+o+'</option>').join('');
  sel.value=src;
  copyLoad();
}
function closeCopyPanel(){ const m=document.getElementById('cpMask'); if(m)m.remove(); }
function copyLoad(){
  const sel=document.getElementById('cpMonth'); const src=sel?sel.value:COPY.month;
  COPY.month=src; COPY.rows=[];
  const box=document.getElementById('cpList'); if(box)box.innerHTML='<div class="prow"><span class="mt">讀取中…</span></div>';
  if(!API_URL){ if(box)box.innerHTML='<div class="prow"><span class="mt">未設定後端網址</span></div>'; return; }
  fetch(API_URL+'?action=list&teacher='+encodeURIComponent(TEACHER)+'&month='+encodeURIComponent(src)+'&cat='+encodeURIComponent(COPY.cat))
    .then(r=>r.json()).then(d=>{
      COPY.rows=(d&&d.ok&&d.data&&d.data[COPY.cat])?d.data[COPY.cat]:[];
      copyRender();
    }).catch(()=>{ if(box)box.innerHTML='<div class="prow"><span class="mt">連線失敗</span></div>'; });
}
function copyNameOf(e){ return (''+(e['姓名']||e['陽世報恩人']||'')).trim(); }
function copyIsVip(nm){ for(let i=0;i<CONTACTS.length;i++) if((''+CONTACTS[i]['姓名']).trim()===nm&&CONTACTS[i]['常客'])return true; return false; }
function copyRender(){
  const box=document.getElementById('cpList'); if(!box)return;
  if(!COPY.rows.length){ box.innerHTML='<div class="prow"><span class="mt">'+COPY.month+' 的「'+COPY.cat+'」沒有資料。</span></div>'; return; }
  const has={}; (DATA[COPY.cat]||[]).forEach(function(e){ has[copyNameOf(e)]=true; });
  box.innerHTML=COPY.rows.map(function(e,i){
    const nm=copyNameOf(e); const dup=!!has[nm];
    const lb=entryLabel(COPY.cat,e);
    return '<div class="prow"><input type="checkbox" id="cp_'+i+'" data-vip="'+(copyIsVip(nm)?1:0)+'"'+(dup?'':' checked')+'>'
      +'<b style="min-width:70px">'+acEsc(nm||'(未填)')+(copyIsVip(nm)?' <span style="color:#e8b93b">★</span>':'')+'</b>'
      +'<span class="mt" style="flex:1">'+acEsc(lb[1])+'</span>'
      +(dup?'<span class="dup">本月已有</span>':'')+'</div>';
  }).join('');
}
function copyCheck(mode){
  COPY.rows.forEach(function(e,i){
    const cb=document.getElementById('cp_'+i); if(!cb)return;
    if(mode===2) cb.checked = cb.dataset.vip==='1';
    else cb.checked = !!mode;
  });
}
function copyGo(){
  const rows=[];
  COPY.rows.forEach(function(e,i){
    const cb=document.getElementById('cp_'+i); if(!cb||!cb.checked)return;
    const o={}; (COLS[COPY.cat]||[]).forEach(function(k){ if(e[k]!=null&&e[k]!=='')o[k]=e[k]; });
    if(Object.keys(o).length)rows.push(o);
  });
  if(!rows.length){ toast('沒有勾選任何一筆'); return; }
  if(!confirm('要把 '+rows.length+' 筆「'+COPY.cat+'」從 '+COPY.month+' 帶進 '+MONTH+' 嗎？\n帶進來之後可以個別按「編輯」改祈願。')) return;
  const btn=document.getElementById('cpGo'); if(btn){btn.disabled=true;btn.textContent='寫入中…';}
  fetch(API_URL,{method:'POST',body:JSON.stringify({action:'addBatch',category:COPY.cat,teacher:TEACHER,month:MONTH,rows:rows})})
    .then(r=>r.json()).then(d=>{
      if(d&&d.ok){ mergeData(d); renderList(); closeCopyPanel(); toast('已帶入 '+rows.length+' 筆 ✓ 記得檢查祈願'); }
      else { toast('帶入失敗：'+((d&&d.error)||'')); if(btn){btn.disabled=false;btn.textContent='帶入本月';} }
    }).catch(()=>{ toast('連線失敗'); if(btn){btn.disabled=false;btn.textContent='帶入本月';} });
}

function lLeapMonth(y){return lunarInfo[y-1900]&0xf;}
function lLeapDays(y){return lLeapMonth(y)?((lunarInfo[y-1900]&0x10000)?30:29):0;}
function lMonthDays(y,m){return (lunarInfo[y-1900]&(0x10000>>m))?30:29;}
function lYearDays(y){let s=348;for(let i=0x8000;i>0x8;i>>=1)s+=(lunarInfo[y-1900]&i)?1:0;return s+lLeapDays(y);}
function solar2lunar(y,m,d){
  if(y<1900||y>2100)return null;
  let offset=Math.floor((Date.UTC(y,m-1,d)-Date.UTC(1900,0,31))/86400000);
  let i,temp=0,ly;
  for(i=1900;i<2101&&offset>0;i++){temp=lYearDays(i);offset-=temp;}
  if(offset<0){offset+=temp;i--;}
  ly=i;const leap=lLeapMonth(i);let isLeap=false;
  for(i=1;i<13&&offset>0;i++){
    if(leap>0&&i===leap+1&&!isLeap){--i;isLeap=true;temp=lLeapDays(ly);}
    else temp=lMonthDays(ly,i);
    if(isLeap&&i===leap+1)isLeap=false;
    offset-=temp;
  }
  if(offset===0&&leap>0&&i===leap+1){if(isLeap)isLeap=false;else{isLeap=true;--i;}}
  if(offset<0){offset+=temp;--i;}
  return {lYear:ly,lMonth:i,lDay:offset+1,isLeap:isLeap};
}
/* 農曆 → 國曆（西元） */
function lunar2solar(ly,lm,ld,isLeap){
  ly=parseInt(ly); lm=parseInt(lm); ld=parseInt(ld);
  if(!(ly>=1900&&ly<=2100))return null;
  if(!(lm>=1&&lm<=12)||!(ld>=1&&ld<=30))return null;
  const leap=lLeapMonth(ly);
  if(isLeap&&leap!==lm) isLeap=false;
  if(isLeap? ld>lLeapDays(ly) : ld>lMonthDays(ly,lm)) return null;
  let off=0;
  for(let i=1900;i<ly;i++) off+=lYearDays(i);
  for(let i=1;i<lm;i++){ off+=lMonthDays(ly,i); if(leap>0&&i===leap) off+=lLeapDays(ly); }
  if(isLeap) off+=lMonthDays(ly,lm);
  off+=ld-1;
  const d=new Date(Date.UTC(1900,0,31)+off*86400000);
  return {y:d.getUTCFullYear(),m:d.getUTCMonth()+1,d:d.getUTCDate()};
}
/* 民國農曆（年可為民國或西元，月可帶「閏」）→ 國曆西元 {y,m,d} */
function l2sWest(by,bm,bd){
  by=parseInt(by); bd=parseInt(bd);
  const ms=''+(bm==null?'':bm); const isLeap=ms.indexOf('閏')>=0;
  const mn=parseInt(ms.replace('閏',''));
  if(!by||!mn||!bd)return null;
  const ly = by>=1000 ? by : by+1911;
  return lunar2solar(ly,mn,bd,isLeap);
}
/* 顯示用：國曆出生日字串，例 1995/10/30 */
function birthSolarStr(by,bm,bd){ const r=l2sWest(by,bm,bd); return r? (r.y+'/'+r.m+'/'+r.d) : ''; }
/* 顯示用：國曆出生日＋農曆原值，手機一行看得完 */
function birthLine(by,bm,bd){
  const lun=[by,bm,bd].filter(function(x){return x!==''&&x!=null;}).join('/');
  const sol=birthSolarStr(by,bm,bd);
  if(sol) return '國曆 '+sol+'（農'+lun+'）';
  return lun? ('農曆 '+lun) : '';
}
/* 民國國曆 → 民國農曆字串 */
function s2lMinguo(my,mm,dd){
  my=parseInt(my);mm=parseInt(mm);dd=parseInt(dd);
  if(!my||!mm||!dd)return null;
  const greg = my>=1000 ? my : my+1911;   // 4位數視為西元，其餘視為民國
  const r=solar2lunar(greg,mm,dd);if(!r)return null;
  return {y:r.lYear-1911,m:(r.isLeap?'閏':'')+r.lMonth,d:r.lDay};
}

function saveMyPw(){
  const name=TEACHER, t=TBYNAME[name]; if(!t) return;
  const oldp=document.getElementById('mpOld').value.trim(), n1=document.getElementById('mpNew').value.trim(), n2=document.getElementById('mpNew2').value.trim();
  const err=m=>{const e=document.getElementById('mpErr');e.textContent=m;e.style.display='block';const b=document.getElementById('mpGo');b.disabled=false;b.textContent='確定修改';};
  document.getElementById('mpErr').style.display='none';
  if(!oldp) return err('請輸入目前的密碼');
  if(n1.length<4) return err('新密碼至少要 4 碼');
  if(/[\s]/.test(n1)) return err('新密碼不能有空白');
  if(n1!==n2) return err('兩次輸入的新密碼不一樣');
  if(n1===oldp) return err('新密碼跟目前的一樣');
  if(n1==='123123') return err('這組不能用，請換一組');
  if(!API_URL) return err('現在連不到系統，請稍後再試');
  const b=document.getElementById('mpGo'); b.disabled=true; b.textContent='處理中…';
  const doSet=function(){
    apiPost('teacherSetPw',{name:name,pw:n1},function(d){
      if(d&&d.ok){
        t.hasPw=true; secLogin(name,n1);
        const ok=document.getElementById('mpOk'); ok.textContent='改好了！下次登入請用新密碼。'; ok.style.display='block';
        b.textContent='完成'; toast('密碼已更新');
        setTimeout(closeMyPw,1600);
      } else err('修改失敗，請稍後再試');
    });
  };
  if(!t.hasPw){ if(oldp===pwOf(t.no)) doSet(); else err('目前的密碼不對'); return; }
  fetch(API_URL+'?action=checkPw&name='+encodeURIComponent(name)+'&pw='+encodeURIComponent(oldp))
    .then(r=>r.json()).then(d=>{ if(d&&d.ok&&d.pass) doSet(); else err('目前的密碼不對'); })
    .catch(()=>err('現在連不到系統，請稍後再試'));
}

/* 通用欄位 HTML */
function fieldHTML(f,reqOverride){
  if(f.group)return `<div class="grouphd">${f.group}</div>`;
  const req=(reqOverride!=null?reqOverride:f.req);
  const egHTML=f.eg?`<div class="fhint" style="color:var(--mut)">例如：${f.eg}</div>`:'';
  const lab=(f.label||f.k)+(req?'<span class="req">*</span>':'');
  if(f.type==='ymd'){
    const oi=f.conv?` oninput="birthPrev('${f.y}','${f.m}','${f.d}','${f.calk}')"`:'';
    const calChange=f.cal?` onchange="${f.conv?`birthPrev('${f.y}','${f.m}','${f.d}','${f.calk}');`:''}toggleLeap('${f.calk}','${f.y}')"`:'';
    let seg='';
    if(f.cal)seg+=`<select class="cal" id="in_${f.calk}"${calChange}><option value="國">國曆</option><option value="農">農曆</option></select>`;
    seg+=`<span class="seg"><input type="number" id="in_${f.y}" placeholder="年"${oi}><span>年</span></span>`;
    seg+=`<span class="seg"><input type="number" id="in_${f.m}" placeholder="月"${oi}><span>月</span></span>`;
    seg+=`<span class="seg"><input type="number" id="in_${f.d}" placeholder="日"${oi}><span>日</span></span>`;
    let h=`<div class="field" data-k="${f.rk||f.y}"><label>${f.label}${req?'<span class="req">*</span>':''}${f.conv?'<span style="font-weight:400;color:var(--mut);font-size:.82em">　西元或民國皆可，不知農曆填國曆自動換算</span>':''}</label><div class="ymd">${seg}</div>`;
    if(f.cal)h+=`<label id="leapwrap_${f.y}" class="leaprow"><input type="checkbox" id="leap_${f.y}"><span>農曆閏月才勾</span></label>`;
    if(f.conv)h+=`<div class="fhint" id="prev_${f.y}"></div>`;
    return h+egHTML+`</div>`;
  }
  if(f.type==='select'){
    const opts=(f.from==='shoudan'
        ? [{v:'',t:'— 未指定'},{v:TEACHER,t:TEACHER+'（本人）'}].concat((TEACHER_SHOUDAN[TEACHER]||[]).map(x=>({v:x,t:x}))).concat([{v:'__add__',t:'＋ 新增收單人…'}])
        : f.opts)||[];
    const optHTML=opts.map(o=>{const v=(o&&typeof o==='object')?o.v:o;const t=(o&&typeof o==='object')?o.t:(o||'—');return `<option value="${hx(v)}">${hx(t)}</option>`;}).join('');
    const onchg=f.onchg?` onchange="${f.onchg}()"`:(f.from==='shoudan'?` onchange="shoudanPick(this)"`:'');
    let h=`<div class="field" data-k="${f.k}"><label>${lab}</label><select id="in_${f.k}"${onchg}>${optHTML}</select>`;
    if(f.hint)h+=`<div class="fhint" id="hint_${f.hint}"></div>`;
    return h+egHTML+`</div>`;
  }
  const labx=lab+(f.max?`<span style="font-weight:400;color:var(--mut);font-size:.8em">（限${f.max}字，最好30字內）</span>`:'');
  let h=`<div class="field" data-k="${f.k}"><label>${labx}</label><input type="${f.type==='num'?'number':'text'}" id="in_${f.k}"${f.def!=null?` value="${f.def}"`:''}${f.max?` maxlength="${f.max}"`:''}${f.oninp?` oninput="${f.oninp}()"`:''}>`;
  if(f.hint)h+=`<div class="fhint" id="hint_${f.hint}"></div>`;
  return h+egHTML+`</div>`;
}

function val(id){const e=document.getElementById('in_'+id);return e?(''+e.value).trim():'';}
function clearMiss(){document.querySelectorAll('.field').forEach(el=>el.classList.remove('miss'));}
function markMiss(k){const el=document.querySelector(`.field[data-k="${k}"]`);if(el)el.classList.add('miss');}

/* 收集單筆（斗燈/祭改/普桌/還陰債/法會編輯）*/
function collectSingle(){
  const o={category:CURCAT,month:MONTH,teacher:TEACHER};
  COLS[CURCAT].forEach(c=>o[c]=val(c));
  if(CURCAT==='還陰債'){
    const cat=o['牒文類別'];
    // 只填姓氏、後面自動補：歷代祖先/嬰靈/辭祖
    const SUF={'歷代祖先':'氏九玄七祖歷代祖先','嬰靈':'氏嬰靈','辭祖':'氏歷代祖先'};
    if(SUF[cat]){ const s=(''+(o['先祖名']||'')).trim(); const tail=SUF[cat].slice(1);
      if(s && s.indexOf(tail)<0) o['先祖名']=s+SUF[cat]; }
    // 個人正魂：先祖名＝姓＋公/姑娘/媽＋名（自動組，不用重填）
    if(cat==='個人正魂'){ o['先祖名']=(o['姓']||'')+(o['公姑娘媽']||'')+(o['名']||''); }
    // 冤親債主：陽世報恩人姓氏 → ○氏前世今生之冤親債主
    if(cat==='冤親債主'){ const n=(''+(o['陽世報恩人']||'')).trim(); if(n) o['先祖名']=n.charAt(0)+'氏前世今生之冤親債主'; }
  }
  applyLunar(CURCAT,o);
  return o;
}
/* 驗證；回傳缺漏欄位陣列 */
function validateSingle(o){
  clearMiss();let miss=[];
  const need=requiredOf(CURCAT,o);
  need.forEach(k=>{if(!(''+(o[k]||'')).trim()){miss.push(k);markMiss(k);}});
  return miss;
}
function requiredOf(cat,o){
  if(cat==='還陰債'){const base=['牒文類別','份數','陽世報恩人','報恩人居住地址'];const cfg=YINCAT[o['牒文類別']];if(!cfg)return base;
    if(cfg.allReq){let r=base.slice();cfg.order.forEach(nm=>{const def=YDEF[nm];if(def.k)r.push(def.k);if(def.type==='ymd')r.push(def.y,def.m,def.d);});return r;}
    return base.concat(cfg.req||[]);}
  if(cat==='斗燈'){let r=['加購類型','份數','姓名','居住地址'];const cf=DOUCONF[o['加購類型']];if(cf)r=r.concat(cf.req);return r;}
  if(cat==='祭改')return ['份數','姓名','居住地址','性別'];
  if(cat==='普桌')return ['份數','姓名','居住地址','捐掉或寄回'];
  if(cat==='法會'){ // 編輯單筆
    let r=['項目','份數','姓名','居住地址'];
    if(FAHUI_NOBIRTH.indexOf(o['項目'])<0)r=r.concat(['生日年','生日月','生日日']);
    return r;
  }
  return [];
}

function submitForm(){
  if(!API_URL){toast('尚未設定 API_URL');return;}
  if(CURCAT==='法會'&&!EDIT.id)return submitFahui();
  const o=collectSingle();const miss=validateSingle(o);
  if(miss.length){toast('必填：'+miss.join('、'));return;}
  const btn=document.getElementById('submitBtn');btn.disabled=true;btn.textContent='送出中…';
  const payload=Object.assign({action:EDIT.id?'update':'add'},o);
  if(EDIT.id){payload['編號']=EDIT.id;payload.category=EDIT.cat;}
  fetch(API_URL,{method:'POST',body:JSON.stringify(payload)}).then(r=>r.json()).then(d=>{
    if(d.ok){DATA=d.data||DATA;TOTALS=d.totals||TOTALS;toast(EDIT.id?'已更新 ✓':'已加入 ✓');cancelEdit(true);clearForm();renderList();setStatus('已連線','ok');}
    else toast('失敗：'+(d.error||'未知'));
  }).catch(e=>toast('連線失敗')).finally(()=>{btn.disabled=false;btn.textContent=EDIT.id?'更新':'加入清單';});
}
/* 法會多項目送出 */
function submitFahui(){
  clearMiss();
  const cust={};FAHUI_CUST.forEach(f=>{if(f.type==='ymd'){cust[f.y]=val(f.y);cust[f.m]=val(f.m);cust[f.d]=val(f.d);if(f.cal)cust[f.calk]=val(f.calk);}else cust[f.k]=val(f.k);});
  let items=getItemRows().filter(it=>it.項目&&it.份數>0);
  let miss=[];
  if(!items.length){toast('請至少選一個項目（份數≥1）');return;}
  if(!cust['姓名']){miss.push('姓名');markMiss('姓名');}
  if(!cust['居住地址']){miss.push('居住地址');markMiss('居住地址');}
  const needBirth=items.some(it=>FAHUI_NOBIRTH.indexOf(it.項目)<0);
  if(needBirth&&!(val('生日年')&&val('生日月')&&val('生日日'))){miss.push('生日');markMiss('生日年');}
  if(miss.length){toast('必填：'+miss.join('、'));return;}
  applyLunar('法會',cust);
  const rows=items.map(it=>Object.assign({},cust,{項目:it.項目,份數:it.份數,祈願:it.祈願||''}));
  const btn=document.getElementById('submitBtn');btn.disabled=true;btn.textContent='送出中…';
  fetch(API_URL,{method:'POST',body:JSON.stringify({action:'addBatch',category:'法會',month:MONTH,teacher:TEACHER,rows:rows})}).then(r=>r.json()).then(d=>{
    if(d.ok){DATA=d.data||DATA;TOTALS=d.totals||TOTALS;toast('已加入 '+rows.length+' 筆 ✓');clearForm();renderList();setStatus('已連線','ok');}
    else toast('失敗：'+(d.error||'未知'));
  }).catch(e=>toast('連線失敗')).finally(()=>{btn.disabled=false;btn.textContent='加入清單';});
}
function clearForm(){renderForm();const fn=document.getElementById('in_姓名')||document.getElementById('in_陽世報恩人');if(fn)fn.focus();}

function startEdit(cat,id){
  const e=(DATA[cat]||[]).find(x=>String(x.編號)===String(id));if(!e)return;
  selectCat(cat);EDIT={cat,id};renderForm();
  COLS[cat].forEach(c=>setv(c,e[c]));
  if(cat==='還陰債')renderYinDetail(),COLS[cat].forEach(c=>setv(c,e[c]));
  if(cat==='斗燈')renderDouDetail(),COLS[cat].forEach(c=>setv(c,e[c]));
  const cb=document.getElementById('in_生日別');if(cb)cb.value='農';
  const lpwrap=document.getElementById('leapwrap_生日年');
  if(lpwrap){ const lp=document.getElementById('leap_生日年'); const mv=''+(e['生日月']||'');
    if(mv.indexOf('閏')===0){ if(lp)lp.checked=true; setv('生日月',mv.replace('閏','')); }
    else if(lp){ lp.checked=false; }
    lpwrap.style.display='flex';
  }
  const pv=document.getElementById('prev_生日年');if(pv)pv.textContent='';
  if(cat==='法會'){ ED_SCEN=''; fahuiEditWish(); }
  document.getElementById('formTitle').textContent='編輯：'+(e.姓名||e.陽世報恩人||'');
  document.getElementById('submitBtn').textContent='更新';
  document.getElementById('cancelBtn').style.display='';
  focusForm();
  renderList();
}
function setv(id,v){const e=document.getElementById('in_'+id);if(e)e.value=(v==null?'':v);}
function cancelEdit(silent){EDIT={cat:null,id:null};document.getElementById('formTitle').textContent='新增明細';document.getElementById('submitBtn').textContent='加入清單';document.getElementById('cancelBtn').style.display='none';if(!silent){renderForm();renderList();}}

function delEntry(cat,id,name){
  if(!confirm('確定刪除「'+(name||'這一筆')+'」？無法復原。\n\n※ 若這筆行政已產生疏文，刪除後請主動通知行政（系統會自動記到「異動記錄」）。'))return;
  fetch(API_URL,{method:'POST',body:JSON.stringify({action:'delete',category:cat,'編號':id,month:MONTH,teacher:TEACHER})}).then(r=>r.json()).then(d=>{
    if(d.ok){DATA=d.data||{};TOTALS=d.totals||{};if(EDIT.id===id)cancelEdit(true);renderList();toast('已刪除');}
    else toast('刪除失敗：'+(d.error||''));
  }).catch(e=>toast('連線失敗'));
}

function onMonth(){MONTH=document.getElementById('month').value.trim();cancelEdit(true);loadList();}
function setStatus(t,c){const s=document.getElementById('status');s.textContent=t;s.className=c||'';}
function loadList(){
  if(!API_URL){renderList();return;}
  setStatus('讀取中…','');
  fetch(`${API_URL}?action=list&teacher=${encodeURIComponent(TEACHER)}&month=${encodeURIComponent(MONTH)}`).then(r=>r.json()).then(d=>{
    if(d.ok){DATA=d.data||{};TOTALS=d.totals||{};renderList();const n=CATS_ORDER.reduce((s,c)=>s+((DATA[c]||[]).length),0);setStatus('已連線 · '+n+' 筆','ok');}
    else setStatus('讀取失敗','err');
  }).catch(e=>setStatus('連線失敗（檢查 API 網址/部署權限）','err'));
}
function esc(s){return (''+(s==null?'':s)).replace(/[\'"<>&`]/g,'');}
function entryLabel(cat,e){
  if(cat==='法會')return [e.姓名||'(未填)', `${e.項目||''} ×${e.份數||0}${e.祈願?' · 祈願:'+e.祈願:''}`];
  if(cat==='斗燈')return [e.姓名||'(未填)', `${e.斗種||''}（${e.加購類型||''}）×${e.份數||0}`];
  if(cat==='還陰債')return [e.陽世報恩人||'(未填)', `${e.牒文類別||''} ×${e.份數||0}`];
  if(cat==='祭改')return [e.姓名||'(未填)', `祭改 ×${e.份數||0} ${e.性別||''}`];
  if(cat==='普桌')return [e.姓名||'(未填)', `普桌 ×${e.份數||0} ${e.捐掉或寄回||''}`];
  return [e.姓名||'',''];
}
function listQuery(){ const e=document.getElementById('listQ'); return e?(e.value||'').trim():''; }
function rowMatches(cat,e,q){
  if(!q) return true;
  const lb=entryLabel(cat,e);
  return (''+lb[0]+' '+lb[1]+' '+(e['公司行號']||'')+' '+(e['收單人']||'')+' '+(e['居住地址']||'')+' '+(e['報恩人居住地址']||'')).indexOf(q)>=0;
}
function renderList(){
  const area=document.getElementById('listArea');let h='';let total=0;
  const q=listQuery(); let all=0, shown=0;
  CATS_ORDER.forEach(cat=>{const all0=DATA[cat]||[];all+=all0.length;const rows=all0.filter(e=>rowMatches(cat,e,q));if(!rows.length)return;total+=rows.length;shown+=rows.length;
    const sum=rows.reduce((s,e)=>s+(parseFloat(e.份數)||0),0);
    h+=`<div class="catgroup"><h3>${cat}<span class="c">${rows.length} 筆 · 共 ${sum} 份</span></h3>`;
    rows.forEach(e=>{const lb=entryLabel(cat,e);const chg=(e.異動?' <span style="color:var(--red);font-size:.78em">●'+(String(e.異動).indexOf('(表)')>=0?(String(e.異動).indexOf('新增')===0?'行政在表上新增':'行政在表上改過'):'已改')+'</span>':'')+(e._beta?'<span class="betatag">內測</span>':'');
      h+=`<div class="entry${EDIT.id===e.編號?' ed':''}"><div class="info">${hx(lb[0])}${chg}<small>${hx(lb[1])}</small></div>
      <div><button class="rowbtn e" onclick="startEdit('${cat}','${esc(e.編號)}')">編輯</button><button class="rowbtn d" onclick="delEntry('${cat}','${esc(e.編號)}','${esc(lb[0])}')">刪除</button></div></div>`;});
    h+=`</div>`;
  });
  const ln=document.getElementById('localNote'); if(ln) ln.innerHTML=localNoteHTML();
  area.innerHTML= total?h:(q?'<p class="empty">找不到「'+hx(q)+'」，本月清單裡沒有這個人。</p>':'<p class="empty">本月尚無資料，從上面選類別新增第一筆。</p>');
  const qn=document.getElementById('listQn'); if(qn) qn.textContent=q?('符合 '+shown+' 筆／本月共 '+all+' 筆'):'';
  renderTotals();
}
function renderTotals(){
  const t=TOTALS||{};const ta=document.getElementById('totArea');
  renderHero();renderCR();
  if(!Object.keys(t).length){ta.innerHTML='';return;}
  const itline=ITEMS.map(i=>`${i.replace(/\(.*\)/,'')} ${t[i]||0}`).join('　');
  ta.innerHTML=`<div class="totbar">本月彙總（寫進統計總表）<br>
  萬寶小計 <b>${t['萬寶小計']||0}</b>　天赦 <b>${t['天赦金']||0}</b>　還陰債 <b>${t['還陰債']||0}</b>　年斗 <b>${t['年斗']||0}</b>　季斗 <b>${t['季斗']||0}</b>　令牌 <b>${t['令牌']||0}</b>　祭改 <b>${t['祭改']||0}</b>　普桌 <b>${t['普桌']||0}</b>
  <div class="items">萬寶金11項：${itline}</div></div>`;
}
let tt;function toast(m){const e=document.getElementById('toast');e.textContent=m;e.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('show'),2300);}

init();

  });
}
function closeAdminPanel(){ const w=document.getElementById('admPanelWrap'); if(w)w.remove(); }
function saveAdminPanel(){
  const cfg={fahui:{}};
  document.querySelectorAll('.adm-fh').forEach(c=>{ cfg.fahui[c.dataset.it]=c.checked; });
  document.querySelectorAll('.adm-cat').forEach(c=>{ cfg[c.dataset.c]=c.checked; });
  OPENCFG=cfg;
  if(API_URL){ fetch(API_URL,{method:'POST',body:JSON.stringify({action:'setOpenItems',config:cfg})}).then(r=>r.json()).catch(()=>{}); }
  closeAdminPanel();
  buildTabs(); if(CATS_ORDER.filter(catOpen).indexOf(CURCAT)<0)selectCat('法會'); else renderForm();
  alert('已儲存！老師重新整理填單頁後即可看到最新開放項目。');
}
</script>
<script>
/* ===== 行政管理介面（密碼123123進入） ===== */
function apiPost(action,payload,cb){ if(!API_URL){cb&&cb({ok:false});return;} fetch(API_URL,{method:'POST',body:JSON.stringify(Object.assign({action:action},payload||{}))}).then(r=>r.json()).then(d=>cb&&cb(d)).catch(()=>cb&&cb({ok:false})); }

function enterAdmin(){
  document.getElementById('app').style.display='none';
  document.getElementById('login').style.display='none';
  const s=document.getElementById('adminScreen'); s.style.display='';
  s.innerHTML='<div style="text-align:center;padding:30px;color:#9c7e3a">載入中…</div>';
  loadTeachers(function(){ loadOpenCfg(function(){ loadSysCfg(function(){ renderAdmin(); }); }); });
}
function exitAdmin(){ location.reload(); }

function renderAdmin(){
  const s=document.getElementById('adminScreen');
  let h='<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px"><div style="font-size:22px;font-weight:800;color:#9c7e3a">🛠 行政管理介面</div><button onclick="exitAdmin()" style="background:#f0ece0;color:#5a4a2a;border:none;border-radius:8px;padding:8px 14px;cursor:pointer">離開</button></div>';
  const card='background:#fff;border:1px solid #e6ddc6;border-radius:12px;padding:16px;margin-bottom:16px';

  h+=`<div style="${card}"><div style="font-weight:800;font-size:16px;color:#5a4a2a;margin-bottom:10px">👥 老師管理</div>`;
  h+='<div style="font-size:12px;color:#8a7a4a;margin-bottom:10px">預設密碼＝123＋編號（例：編號22→12322）；可按「密碼」為個別老師設定自訂密碼（留空＝回復預設）。刪除老師不會刪掉他的資料表。</div>';
  h+='<table style="width:100%;border-collapse:collapse;font-size:14px"><thead><tr style="background:#f7f2e6"><th style="padding:6px;text-align:left;width:60px">編號</th><th style="padding:6px;text-align:left">姓名</th><th style="padding:6px;width:120px">操作</th></tr></thead><tbody>';
  TEACHERS.forEach(t=>{ h+=`<tr style="border-top:1px solid #eee"><td style="padding:6px">${t.no}</td><td style="padding:6px">${t.name}${t.hasPw?'<span style="font-size:11px;color:#9c7e3a;margin-left:4px">🔑自訂</span>':''}</td><td style="padding:6px;text-align:center;white-space:nowrap"><button onclick="admTeacherRename('${t.name}')" style="border:1px solid #9c7e3a;background:#fff;color:#9c7e3a;border-radius:6px;padding:4px 8px;cursor:pointer;font-size:12px">改名</button> <button onclick="admTeacherPw('${t.name}')" style="border:1px solid #5a4a2a;background:#fff;color:#5a4a2a;border-radius:6px;padding:4px 8px;cursor:pointer;font-size:12px">密碼</button> <button onclick="admTeacherDel('${t.name}')" style="border:1px solid #c0392b;background:#fff;color:#c0392b;border-radius:6px;padding:4px 8px;cursor:pointer;font-size:12px">刪除</button></td></tr>`; });
  h+='</tbody></table>';
  h+='<div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap"><input id="admTName" placeholder="新老師姓名" style="flex:1;min-width:120px;padding:9px;border:1px solid #d8cca8;border-radius:7px"><input id="admTNo" type="number" placeholder="編號(留空自動)" style="width:130px;padding:9px;border:1px solid #d8cca8;border-radius:7px"><button onclick="admTeacherAdd()" style="background:#9c7e3a;color:#fff;border:none;border-radius:7px;padding:9px 16px;cursor:pointer;font-weight:700">＋新增</button></div></div>';

  h+=`<div style="${card}"><div style="font-weight:800;font-size:16px;color:#5a4a2a;margin-bottom:10px">🧾 收單人（下線）管理</div>`;
  h+='<select id="admShTeacher" onchange="admRenderShoudan()" style="padding:9px;border:1px solid #d8cca8;border-radius:7px;width:100%;margin-bottom:10px">'+TEACHERS.map(t=>`<option value="${t.name}">${t.no}　${t.name}</option>`).join('')+'</select>';
  h+='<div id="admShBox"></div></div>';

  h+=`<div style="${card}"><div style="font-weight:800;font-size:16px;color:#5a4a2a;margin-bottom:10px">🏷 法會項目管理</div>`;
  h+='<div style="font-size:12px;color:#8a7a4a;margin-bottom:10px">改顯示名稱：老師看到的名字會變，計價與業績仍用原始項目，安全。停用/開放請用下方「開放設定」。新增全新項目需另設單價，請找工程處理。</div>';
  FAHUI_ITEMS.forEach(o=>{ h+=`<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px"><span style="width:160px;font-size:13px;color:#777">${o}</span><input class="adm-lbl" data-it="${o}" value="${labelOf(o)===o?'':labelOf(o)}" placeholder="（不改留空）" style="flex:1;padding:7px;border:1px solid #d8cca8;border-radius:6px"></div>`; });
  h+='<button onclick="admSaveLabels()" style="margin-top:8px;background:#9c7e3a;color:#fff;border:none;border-radius:7px;padding:9px 16px;cursor:pointer;font-weight:700">儲存項目顯示名稱</button>';
  h+=' <button onclick="openAdminPanel()" style="margin-top:8px;background:#5a4a2a;color:#fff;border:none;border-radius:7px;padding:9px 16px;cursor:pointer">⚙ 開放設定</button></div>';

  h+=`<div style="${card}"><div style="font-weight:800;font-size:16px;color:#5a4a2a;margin-bottom:10px">🛡 行政人員</div>`;
  h+='<div style="font-size:12px;color:#8a7a4a;margin-bottom:10px">行政人員名單（記錄用）。所有行政共用密碼 123123 進入本介面。</div>';
  h+='<div id="admAdminBox" style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px">'+admAdminChips()+'</div>';
  h+='<div style="display:flex;gap:8px"><input id="admAdminName" placeholder="新增行政人員姓名" style="flex:1;padding:9px;border:1px solid #d8cca8;border-radius:7px"><button onclick="admAdminAdd()" style="background:#9c7e3a;color:#fff;border:none;border-radius:7px;padding:9px 16px;cursor:pointer;font-weight:700">＋新增</button></div></div>';

  s.innerHTML=h;
  admRenderShoudan();
}
function admAdminChips(){ if(!ADMINS.length) return '<span style="color:#aaa;font-size:13px">尚無</span>'; return ADMINS.map(n=>`<span style="background:#f0ece0;border-radius:16px;padding:5px 10px;font-size:13px">${n} <b onclick="admAdminDel('${n}')" style="cursor:pointer;color:#c0392b">✕</b></span>`).join(''); }

function admTeacherAdd(){ const name=(document.getElementById('admTName').value||'').trim(); const no=(document.getElementById('admTNo').value||'').trim(); if(!name){alert('請輸入姓名');return;} apiPost('teacherAdd',{name:name,no:no},function(d){ if(d&&d.ok){ enterAdmin(); } else alert('新增失敗：'+((d&&d.error)||'')); }); }
function admTeacherRename(old){ const name=(prompt('新姓名：',old)||'').trim(); if(!name||name===old)return; apiPost('teacherUpdate',{oldName:old,name:name},function(d){ if(d&&d.ok)enterAdmin(); else alert('改名失敗：'+((d&&d.error)||'')); }); }
function admTeacherDel(name){ if(!confirm('確定刪除老師「'+name+'」？（資料表不會被刪）'))return; apiPost('teacherDelete',{name:name},function(d){ if(d&&d.ok)enterAdmin(); else alert('刪除失敗：'+((d&&d.error)||'')); }); }
function admTeacherPw(name){
  const t=TBYNAME[name];
  const cur=t&&t.hasPw?'（目前：已設自訂密碼）':'（目前：預設 123'+(t?t.no:'')+'）';
  const p=prompt('設定「'+name+'」的登入密碼 '+cur+'\n\n輸入新密碼後按確定；\n留空按確定＝清除自訂，回復預設 123+編號。','');
  if(p===null)return;
  apiPost('teacherSetPw',{name:name,pw:p.trim()},function(d){
    if(d&&d.ok){ alert(p.trim()?('已設定！'+name+' 的新密碼為：'+p.trim()):('已清除，'+name+' 回復預設密碼 123'+(t?t.no:''))); enterAdmin(); }
    else alert('設定失敗：'+((d&&d.error)||''));
  });
}

function admRenderShoudan(){ const t=document.getElementById('admShTeacher').value; const tt=TBYNAME[t]; const box=document.getElementById('admShBox');
  const list=(tt&&tt.shoudan)||[];
  let h='<div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px">';
  h+= list.length?list.map(n=>`<span style="background:#f0ece0;border-radius:16px;padding:5px 10px;font-size:13px">${n} <b onclick="admShoudanDel('${t}','${n}')" style="cursor:pointer;color:#c0392b">✕</b></span>`).join(''):'<span style="color:#aaa;font-size:13px">尚無收單人</span>';
  h+='</div><div style="display:flex;gap:8px"><input id="admShName" placeholder="新增收單人姓名" style="flex:1;padding:9px;border:1px solid #d8cca8;border-radius:7px"><button onclick="admShoudanAdd(\''+t+'\')" style="background:#9c7e3a;color:#fff;border:none;border-radius:7px;padding:9px 16px;cursor:pointer;font-weight:700">＋新增</button></div>';
  box.innerHTML=h;
}
function admShoudanAdd(t){ const n=(document.getElementById('admShName').value||'').trim(); if(!n)return; const tt=TBYNAME[t]; const list=((tt&&tt.shoudan)||[]).slice(); if(list.indexOf(n)<0)list.push(n); apiPost('shoudanSet',{teacher:t,list:list},function(d){ if(d&&d.ok){ if(tt)tt.shoudan=list; admRenderShoudan(); } else alert('失敗'); }); }
function admShoudanDel(t,n){ const tt=TBYNAME[t]; const list=((tt&&tt.shoudan)||[]).filter(x=>x!==n); apiPost('shoudanSet',{teacher:t,list:list},function(d){ if(d&&d.ok){ if(tt)tt.shoudan=list; admRenderShoudan(); } else alert('失敗'); }); }

function admSaveLabels(){ const map={}; document.querySelectorAll('.adm-lbl').forEach(i=>{ const v=(i.value||'').trim(); if(v) map[i.dataset.it]=v; }); apiPost('itemLabelSet',{itemLabels:map},function(d){ if(d&&d.ok){ ITEMLABELS=map; alert('已儲存！老師重新整理後看到新名稱。'); } else alert('失敗'); }); }

function admAdminAdd(){ const n=(document.getElementById('admAdminName').value||'').trim(); if(!n)return; apiPost('adminAdd',{name:n},function(d){ if(d&&d.ok){ ADMINS=d.admins||[]; document.getElementById('admAdminBox').innerHTML=admAdminChips(); document.getElementById('admAdminName').value=''; } else alert('失敗'); }); }
function admAdminDel(n){ apiPost('adminDelete',{name:n},function(d){ if(d&&d.ok){ ADMINS=d.admins||[]; document.getElementById('admAdminBox').innerHTML=admAdminChips(); } else alert('失敗'); }); }
</script>
</body></html>
